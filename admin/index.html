<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performative Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  /* The app's look: black on white, one soft grey surface (no outlines), Inter Tight Bold titles,
     the system font for everything else, capsules and 14px corners. Colour only from sponsors. */
  :root {
    --ink:#0A0A0A; --paper:#FFFFFF; --bg:#FFFFFF; --card:#F4F4F4; --soft:#F4F4F4; --soft2:#EAEAEA;
    --muted:#5C5C5C; --muted2:#A3A3A3; --hair:#E6E6E6; --red:#E5372B; --redbg:#FDECEB;
    --green:#0A0A0A; --greenbg:#F4F4F4; --amber:#0A0A0A; --amberbg:#F4F4F4; --blue:#0A0A0A; --bluebg:#F4F4F4;
    --r:14px; --shadow:none;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter Tight", system-ui, sans-serif;
    --display: "Inter Tight", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px; -webkit-font-smoothing:antialiased; }
  h1, h2, h3 { font-family:var(--display); font-weight:700; margin:0; letter-spacing:-.025em; }
  h1 { font-size:34px; line-height:1.05; } h2 { font-size:26px; } h3 { font-size:19px; letter-spacing:-.015em; }
  button, input, select, textarea { font:inherit; color:inherit; }
  a { color:inherit; }
  .eyebrow { font-size:11px; font-weight:500; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .hidden { display:none !important; }
  .mark { font-family:"Instrument Serif", serif; font-weight:400; letter-spacing:0; }

  /* Header: the "P." mark, and the tabs as one glass capsule, like the app's menu */
  .shell { min-height:100vh; }
  aside.side { position:sticky; top:0; z-index:15; display:flex; align-items:center; gap:18px; padding:14px 28px; background:rgba(255,255,255,.82); backdrop-filter:saturate(1.6) blur(18px); -webkit-backdrop-filter:saturate(1.6) blur(18px); }
  aside .brand { font-family:"Instrument Serif", serif; font-size:30px; line-height:1; display:flex; align-items:baseline; gap:10px; white-space:nowrap; }
  aside .brand small { font-family:var(--sans); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:500; }
  aside nav { display:flex; gap:2px; margin:0 auto; padding:5px; border-radius:999px; background:rgba(255,255,255,.75); box-shadow:0 8px 28px rgba(0,0,0,.10), inset 0 0 0 .5px rgba(0,0,0,.06); overflow-x:auto; scrollbar-width:none; }
  aside nav::-webkit-scrollbar { display:none; }
  aside nav button { all:unset; position:relative; display:flex; align-items:center; gap:7px; padding:9px 15px; border-radius:999px; cursor:pointer; color:var(--muted); font-weight:600; font-size:13px; white-space:nowrap; transition:background .15s, color .15s; }
  aside nav button svg { width:17px; height:17px; flex:none; }
  aside nav button:hover { color:var(--ink); }
  aside nav button.on { background:var(--ink); color:#fff; }
  aside nav .badge { position:absolute; top:4px; right:6px; min-width:8px; height:8px; padding:0; border-radius:99px; background:var(--red); color:transparent; font-size:0; }
  aside .me { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); white-space:nowrap; }
  aside .me button { all:unset; cursor:pointer; color:var(--ink); font-weight:600; padding:8px 14px; border-radius:99px; background:var(--card); }
  main { max-width:1240px; margin:0 auto; padding:18px 28px 80px; min-width:0; }
  .pagehead { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:14px 0 22px; flex-wrap:wrap; }
  .pagehead p { margin:6px 0 0; color:var(--muted); max-width:640px; line-height:1.45; }
  @media (max-width: 980px) { aside .me #who { display:none; } }
  @media (max-width: 760px) {
    aside.side { padding:12px 14px; gap:10px; } aside .brand small { display:none; }
    aside nav { position:fixed; left:12px; right:12px; bottom:14px; margin:0; justify-content:space-between; }
    aside nav button { padding:10px; } aside nav button span.lbl { display:none; }
    main { padding:10px 14px 110px; } h1 { font-size:28px; }
  }

  /* Surfaces */
  .card { background:var(--card); border-radius:var(--r); padding:18px; }
  .grid { display:grid; gap:10px; }
  .kpis { grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); }
  .kpi { background:var(--card); border-radius:var(--r); padding:16px; }
  .kpi b { display:block; font-family:var(--display); font-size:30px; font-weight:700; letter-spacing:-.03em; margin-top:6px; }
  .kpi.alert { background:var(--ink); color:#fff; } .kpi.alert .eyebrow { color:#a3a3a3; }
  .btn { border:0; background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; text-decoration:none; transition:opacity .15s, transform .1s; }
  .btn:hover { opacity:.86; } .btn:active { transform:scale(.98); }
  .btn.ghost, .btn.line { background:var(--card); color:var(--ink); box-shadow:none; } .btn.ghost:hover, .btn.line:hover { background:var(--soft2); opacity:1; }
  .card .btn.ghost, .card .btn.line { background:#fff; }
  .btn.red { background:var(--red); } .btn.green { background:var(--ink); }
  .btn.small { padding:7px 13px; font-size:13px; }
  .btn:disabled { opacity:.35; cursor:default; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:99px; background:#fff; color:var(--muted); white-space:nowrap; vertical-align:1px; }
  .card .pill { background:#fff; } td .pill { background:var(--card); }
  .pill.live { background:var(--ink); color:#fff; }
  .pill.live::before { content:""; width:6px; height:6px; border-radius:50%; background:#fff; }
  .pill.scheduled { background:var(--soft2); color:var(--ink); }
  .pill.draft { background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1px var(--hair); }
  .pill.ended { color:var(--muted2); }
  .pill.red { background:var(--redbg); color:var(--red); }
  .pill.dark { background:var(--ink); color:#fff; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:13px 10px; border-bottom:1px solid var(--hair); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  th { font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:500; }
  tr.click { cursor:pointer; } tr.click:hover td { background:rgba(0,0,0,.025); }
  .card table th, .card table td { border-color:#E2E2E2; }
  .segs { display:inline-flex; background:var(--card); border-radius:999px; padding:4px; gap:2px; flex-wrap:wrap; }
  .card .segs { background:#fff; }
  .segs button { all:unset; padding:8px 14px; border-radius:999px; cursor:pointer; font-weight:600; font-size:13px; color:var(--muted); }
  .segs button:hover { color:var(--ink); }
  .segs button.on { background:var(--ink); color:#fff; } .segs button.on .muted { color:#a3a3a3; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .search { position:relative; } .search input, .search input[type=search] { padding-left:38px; min-width:260px; border-radius:999px; }
  .search::before { content:""; position:absolute; left:15px; top:50%; width:13px; height:13px; transform:translateY(-55%); background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235C5C5C' stroke-width='2.4' stroke-linecap='round'><circle cx='10.5' cy='10.5' r='7'/><path d='M16 16l5 5'/></svg>"); z-index:1; }
  .space { flex:1; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .swatch { width:14px; height:14px; border-radius:4px; display:inline-block; vertical-align:-2px; }
  .logo { width:38px; height:38px; border-radius:12px; object-fit:cover; background:var(--card); display:inline-grid; place-items:center; font-weight:700; color:#fff; vertical-align:middle; flex:none; }

  /* Fields: soft grey, no outline, like the app */
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=email], input[type=password], input[type=url], input[type=search], select, textarea {
    width:100%; border:0; background:var(--card); border-radius:var(--r); padding:12px 14px; outline:none; transition:box-shadow .15s, background .15s; }
  .card input[type=text], .card input[type=number], .card input[type=date], .card input[type=time], .card input[type=email], .card input[type=password], .card input[type=url], .card input[type=search], .card select, .card textarea { background:#fff; }
  input:focus, select:focus, textarea:focus { box-shadow:0 0 0 2px var(--ink); }
  input[readonly] { color:var(--muted); }
  select { appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230A0A0A' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; background-size:13px; padding-right:38px; }
  textarea { min-height:84px; resize:vertical; }
  label.f { display:block; margin-bottom:14px; }
  label.f > span, .flabel { display:block; font-size:13px; font-weight:600; margin-bottom:7px; }
  label.f small, .flabel small { color:var(--muted); font-weight:400; }
  .help { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.45; }
  .err { font-size:12px; color:var(--red); margin-top:6px; font-weight:600; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .three { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width: 640px) { .two, .three { grid-template-columns:1fr; } }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { all:unset; cursor:pointer; padding:8px 14px; border-radius:99px; background:#fff; font-size:13px; font-weight:600; color:var(--ink); }
  .chip:hover { background:var(--soft2); } .chip.on { background:var(--ink); color:#fff; }
  .switch { display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid #E2E2E2; cursor:pointer; }
  .switch:last-child { border-bottom:0; }
  .switch .t { flex:1; } .switch .t b { display:block; font-weight:600; } .switch .t span { color:var(--muted); font-size:12px; line-height:1.4; }
  .switch input[type=checkbox] { appearance:none; width:51px; height:31px; background:#E2E2E2; border-radius:99px; position:relative; cursor:pointer; transition:background .2s; flex:none; margin:0; }
  .switch input[type=checkbox]::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 2px 6px rgba(0,0,0,.18); }
  .switch input[type=checkbox]:checked { background:var(--ink); } .switch input[type=checkbox]:checked::after { left:22px; }
  .card .switch input[type=checkbox] { background:#DCDCDC; } .card .switch input[type=checkbox]:checked { background:var(--ink); }
  .switch input[type=time] { width:130px; flex:none; }

  /* Editor */
  .editor { display:grid; grid-template-columns:190px minmax(0,1fr) 330px; gap:22px; align-items:start; }
  @media (max-width: 1200px) { .editor { grid-template-columns:minmax(0,1fr) 320px; } .steps { display:none; } }
  @media (max-width: 900px) { .editor { grid-template-columns:1fr; } }
  .steps { position:sticky; top:86px; display:flex; flex-direction:column; gap:2px; }
  .steps a { text-decoration:none; padding:9px 12px; border-radius:99px; color:var(--muted); font-weight:600; display:flex; gap:9px; align-items:center; font-size:13px; }
  .steps a:hover { background:var(--card); color:var(--ink); }
  .steps a .n { width:20px; height:20px; border-radius:50%; background:var(--card); display:grid; place-items:center; font-size:11px; font-weight:700; color:var(--muted); }
  .steps a.ok .n { background:var(--ink); color:#fff; }
  .steps a.bad .n { background:var(--red); color:#fff; }
  .section { scroll-margin-top:90px; margin-bottom:12px; }
  .section h3 { margin-bottom:4px; } .section > p { margin:0 0 16px; color:var(--muted); font-size:13px; line-height:1.45; }
  .sticky { position:sticky; top:86px; }
  .savebar { position:sticky; bottom:16px; margin-top:6px; background:rgba(10,10,10,.92); backdrop-filter:blur(16px); color:#fff; border-radius:999px; padding:9px 9px 9px 22px; display:flex; gap:8px; align-items:center; box-shadow:0 12px 34px rgba(0,0,0,.22); flex-wrap:wrap; z-index:5; }
  .savebar .btn.ghost { background:rgba(255,255,255,.12); color:#fff; } .savebar .btn.ghost:hover { background:rgba(255,255,255,.2); }
  .savebar .btn.white { background:#fff; color:var(--ink); }
  @media (max-width: 760px) { .savebar { bottom:84px; border-radius:22px; } }
  .stepsrow { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .stepsrow .num { width:26px; height:26px; border-radius:50%; background:#fff; display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }
  .iconbtn { all:unset; cursor:pointer; width:32px; height:32px; display:grid; place-items:center; border-radius:50%; color:var(--muted); flex:none; }
  .iconbtn:hover { background:#fff; color:var(--ink); }

  /* Phone preview: the app's own card */
  .phone { width:300px; margin:0 auto; background:#000; border-radius:46px; padding:10px; box-shadow:0 24px 60px rgba(0,0,0,.18); }
  .screen { background:#fff; border-radius:37px; overflow:hidden; height:600px; display:flex; flex-direction:column; }
  .screen .status { height:36px; display:flex; justify-content:space-between; align-items:center; padding:0 26px; font-size:12px; font-weight:600; }
  .screen .scroll { overflow:auto; padding:4px 16px 16px; flex:1; }
  .screen .scroll > div:first-child[style*="font-size:26px"] { font-family:var(--display) !important; font-weight:700; letter-spacing:-.03em; text-align:center; font-size:22px !important; }
  .pcard { border-radius:22px; padding:16px; color:#fff; min-height:176px; display:flex; flex-direction:column; justify-content:space-between; }
  .pcard .wm { font-weight:700; letter-spacing:.16em; font-size:10.5px; display:flex; align-items:center; gap:7px; }
  .pcard .wm img { width:18px; height:18px; border-radius:5px; background:#fff; object-fit:contain; }
  .pcard h4 { font-family:var(--display); font-weight:700; letter-spacing:-.03em; font-size:25px; line-height:1.02; margin:14px 0 6px; }
  .pcard .meta { font-size:12px; opacity:.88; }
  .pcard .join { align-self:flex-start; margin-top:12px; background:#fff; color:#111; border-radius:99px; padding:7px 14px; font-weight:700; font-size:12px; }
  .ptint { border-radius:14px; padding:12px; margin-top:10px; }
  .plist { margin-top:14px; } .plist div { display:flex; gap:9px; font-size:12px; margin-bottom:8px; color:#333; }
  .plist div span { width:18px; height:18px; border-radius:50%; background:#F4F4F4; flex:none; display:grid; place-items:center; font-size:10px; font-weight:700; }
  .notif { background:#F4F4F4; border-radius:16px; padding:10px 12px; font-size:12px; margin:8px 0; }
  .notif b { display:block; font-size:10.5px; color:var(--muted); font-weight:600; margin-bottom:2px; letter-spacing:.04em; }

  /* Colour */
  .colorrow { display:flex; gap:10px; align-items:center; }
  .colorrow input[type=color] { appearance:none; -webkit-appearance:none; width:46px; height:44px; border:0; padding:0; background:none; cursor:pointer; flex:none; }
  .colorrow input[type=color]::-webkit-color-swatch-wrapper { padding:0; } .colorrow input[type=color]::-webkit-color-swatch { border:none; border-radius:14px; }
  .colorrow input[type=color]::-moz-color-swatch { border:none; border-radius:14px; }
  .colorrow input[type=text] { font-family:ui-monospace, Menlo, monospace; text-transform:uppercase; }
  .wheel { width:180px; height:180px; border-radius:50%; position:relative; cursor:crosshair; flex:none;
    background: radial-gradient(circle closest-side, #fff, rgba(255,255,255,0) 100%), conic-gradient(red, yellow, lime, aqua, blue, magenta, red); }
  .wheel .dot { position:absolute; width:18px; height:18px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.35); transform:translate(-50%,-50%); pointer-events:none; }
  .light { width:100%; height:12px; border-radius:99px; appearance:none; -webkit-appearance:none; outline:none; cursor:pointer; }
  .light::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .swatches { display:flex; gap:6px; flex-wrap:wrap; }
  .swatches button { all:unset; cursor:pointer; width:30px; height:30px; border-radius:10px; }
  .contrast { font-size:12px; font-weight:600; display:inline-flex; gap:6px; align-items:center; padding:4px 10px; border-radius:99px; background:#fff; margin-left:6px; }
  .contrast.bad { background:var(--ink); color:#fff; }

  /* Country picker */
  .combo { position:relative; }
  .combo .list { position:absolute; z-index:6; left:0; right:0; top:calc(100% + 6px); background:#fff; border-radius:16px; box-shadow:0 16px 40px rgba(0,0,0,.16); max-height:260px; overflow:auto; padding:6px; }
  .combo .list button { all:unset; display:flex; gap:10px; width:100%; box-sizing:border-box; padding:9px 12px; border-radius:10px; cursor:pointer; }
  .combo .list button:hover { background:var(--card); }
  .chart svg { width:100%; height:120px; display:block; }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-weight:600; z-index:40; display:none; max-width:90vw; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .toast.err { background:var(--red); }
  @media (max-width: 760px) { .toast { bottom:96px; } }
  .login { max-width:380px; margin:16vh auto; padding:0 16px; text-align:center; }
  .login .mark { font-size:64px; line-height:1; display:block; margin-bottom:6px; }
  .login form { text-align:left; margin-top:22px; }
  .empty { text-align:center; padding:44px 10px; color:var(--muted); }
  .thumb { width:64px; height:64px; object-fit:cover; border-radius:12px; background:var(--card); }
  .copy { font-family: ui-monospace, Menlo, monospace; font-size:12px; word-break:break-all; background:#fff; padding:12px; border-radius:12px; }
  .scard { cursor:pointer; transition:transform .15s; } .scard:hover { transform:translateY(-2px); }
  .scard .band { height:76px; border-radius:12px; margin-bottom:12px; display:flex; align-items:flex-end; padding:10px; color:#fff; font-weight:700; letter-spacing:.14em; font-size:11px; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); z-index:30; display:flex; align-items:center; justify-content:center; padding:16px; }
  .modalbox { background:#fff; border-radius:22px; width:min(720px, 100%); max-height:92vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 30px 80px rgba(0,0,0,.25); }
  .modalbox iframe { width:100%; height:75vh; border:0; background:#EDEDEA; }
  .quote { background:var(--ink); color:#fff; border-radius:22px; padding:22px; }
  .quote .big { font-family:var(--display); font-size:44px; font-weight:700; letter-spacing:-.035em; margin:6px 0 2px; }
  .quote .muted { color:#a3a3a3; }
  .qgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
  .qgrid div { background:#1d1d1d; border-radius:14px; padding:10px 12px; } .qgrid b { display:block; font-family:var(--display); font-size:19px; } .qgrid span { font-size:11px; color:#a3a3a3; }
  .breakdown td, .breakdown th { padding:9px 6px; font-size:13px; } .breakdown td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .formula { font-family: ui-monospace, Menlo, monospace; font-size:12px; background:#fff; border-radius:14px; padding:12px 14px; line-height:1.7; white-space:pre-wrap; }
  .shelf { display:flex; gap:6px; overflow-x:auto; padding:6px 2px 14px; margin-bottom:4px; }
  .brandchip { all:unset; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; width:80px; flex:none; transition:transform .2s, opacity .2s, filter .2s; }
  .brandchip .disc { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; overflow:hidden; }
  .brandchip .disc img { width:28px; height:28px; object-fit:contain; } .brandchip .disc b { font-family:var(--display); font-size:21px; font-weight:700; }
  .brandchip .nm { font-size:11px; color:var(--muted); max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .brandchip .ct { font-size:10px; color:var(--muted2); margin-top:-4px; }
  .brandchip.on { transform:scale(1.1); } .brandchip.on .nm { color:var(--ink); font-weight:600; }
  .brandchip.dim { opacity:.5; filter:blur(1px); }
</style>
</head>
<body>

<!-- Sign in -->
<section id="login" class="login hidden">
  <span class="mark">P.</span>
  <h1 style="margin:6px 0 6px">Admin</h1>

<script>
// Public by design (they ship in the app). Every change is checked on the server: only admins can do anything here.
const SUPABASE_URL = "https://rwyopnhqcnwsxcgpwgtr.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_wo0jRHFIC1S-EiX_e5VQjg_WHEjZ4ji";
const REPORT_BASE = "https://performativegroup.github.io/reports/";

const sb = supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("en-GB");
const dayLabel = d => d ? new Date(String(d).length <= 10 ? d + "T00:00:00" : d).toLocaleDateString("en-GB", { day:"numeric", month:"short" }) : "";
const when = d => d ? new Date(d).toLocaleString("en-GB", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }) : "";
const todayISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

const GROUPS = ["Exercise","Learning","Work","Arts","Mind","Home","Other"];
const slotLabel = s => !s ? "" : s === "all" ? "Featured · Main" : `Featured · ${s}`;
const CATEGORIES = { Exercise:["Workout","Walking","Running","Gym","Yoga","Cycling","Swimming","Sport"], Learning:["Reading","Studying","Language","Coding"],
  Work:["Work","Writing"], Arts:["Music practice","Art","Writing"], Mind:["Meditation","Journaling","Yoga"], Home:["Cooking","Cleaning"], Other:["Other"] };
const ALL_CATEGORIES = [...new Set(Object.values(CATEGORIES).flat())];
const METRICS = { time:{ label:"Time", unit:"minutes a day", eg:"e.g. 20", step:5, def:20 }, km:{ label:"Distance", unit:"km a day", eg:"e.g. 3", step:0.5, def:3 }, steps:{ label:"Steps", unit:"steps a day", eg:"e.g. 8000", step:500, def:8000 } };
// Every country (ISO 3166 two-letter codes); names come from the browser in your language.
const COUNTRY_CODES = "AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BV BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM ZW".split(" ");
const regionNames = new Intl.DisplayNames(["en"], { type:"region" });
const flag = c => c ? String.fromCodePoint(...[...c].map(ch => 0x1F1A5 + ch.charCodeAt(0))) : "🌍";
const SHORT_NAMES = { HK:"Hong Kong", MO:"Macau" };
const countryName = c => c ? (SHORT_NAMES[c] || regionNames.of(c) || c) : "Worldwide";
const COUNTRIES = COUNTRY_CODES.map(c => ({ code:c, name:countryName(c) })).sort((a, b) => a.name.localeCompare(b.name));
const POPULAR = ["HK","SG","GB","US","AU","CA","TW","JP","KR","MY","AE","FR","DE","CN"];

function toast(msg, err = false) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", err ? 5000 : 2400);
}
function fail(e) { console.error(e); toast(e?.message || String(e), true); }

// ---------------- Sign in ----------------
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data: admin, error } = await sb.rpc("am_admin");
  if (error || !admin) { await sb.auth.signOut(); return showLogin("This account isn't an admin."); }
  $("#who").textContent = session.user.email;
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  openTab(location.hash.slice(1).split("/")[0] || "overview");
  refreshReportBadge();
}
function showLogin(msg = "") { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#loginErr").textContent = msg; }
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("#loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
  if (error) { $("#loginErr").textContent = "That email and password don't match."; return; }
  $("#password").value = ""; start();
});
$("#signOut").onclick = async () => { await sb.auth.signOut(); showLogin(); };

// ---------------- Tabs ----------------
const loaders = { overview: loadOverview, challenges: () => loadChallenges(), sponsors: () => loadSponsors(), requests: () => loadRequests(), reports: () => loadReports(), people: () => loadPeople(), pricing: () => loadPricing() };
function openTab(name) {
  if (!loaders[name]) name = "overview";
  history.replaceState(null, "", "#" + name);
  $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  Object.keys(loaders).forEach(k => $("#tab-" + k).classList.toggle("hidden", k !== name));
  Promise.resolve(loaders[name]()).catch(fail);
  window.scrollTo(0, 0);
}
$$("#tabs button").forEach(b => b.onclick = () => openTab(b.dataset.tab));
async function refreshReportBadge() {
  const { data } = await sb.rpc("admin_reports", { include_resolved: false });
  const n = (data || []).length, b = $("#reportCount");
  b.textContent = n; b.classList.toggle("hidden", !n);
  const { count } = await sb.from("sponsor_requests").select("id", { count:"exact", head:true }).eq("status", "pending");
  const rb = $("#requestCount"); rb.textContent = count || 0; rb.classList.toggle("hidden", !count);
}

// ---------------- Overview ----------------
function bars(rows, key, label) {
  const max = Math.max(1, ...rows.map(r => r[key])), w = 600, h = 110, bw = w / Math.max(rows.length, 1);
  const rects = rows.map((r, i) => {
    const bh = Math.round((r[key] / max) * (h - 10));
    return `<rect x="${i * bw + 1}" y="${h - bh}" width="${Math.max(2, bw - 3)}" height="${Math.max(bh, 1.5)}" rx="2" fill="${i === rows.length - 1 ? "#0A0A0A" : "#BDBDB8"}"><title>${dayLabel(r.day)}: ${fmt(r[key])}</title></rect>`;
  }).join("");
  const total = rows.reduce((a, r) => a + r[key], 0);
  return `<div class="card chart"><div class="row"><span class="eyebrow">${label}</span><span class="space"></span><b>${fmt(total)}</b><span class="muted small">30 days</span></div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${label} per day" style="margin-top:12px">${rects}</svg>
    <div class="row muted small" style="margin-top:6px"><span>${dayLabel(rows[0]?.day)}</span><span class="space"></span><span>Today</span></div></div>`;
}
async function loadOverview() {
  const el = $("#tab-overview");
  const [{ data, error }, ch] = await Promise.all([sb.rpc("admin_overview"), sb.from("challenges").select("id,title,status,starts_on,ends_on,featured")]);
  if (error) throw error;
  const t = data.totals, d = data.daily || [];
  const today = todayISO();
  const upcoming = (ch.data || []).filter(c => c.status === "live" && c.starts_on > today).sort((a, b) => a.starts_on.localeCompare(b.starts_on));
  const endingSoon = (ch.data || []).filter(c => c.status === "live" && c.starts_on <= today && daysBetween(today, c.ends_on) <= 3 && c.ends_on >= today);
  const drafts = (ch.data || []).filter(c => c.status === "draft");
  el.innerHTML = `
    <div class="pagehead"><div><div class="eyebrow">${new Date().toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" })}</div><h1>Overview</h1></div>
      <div class="row"><button class="btn" id="ovNew">＋ New challenge</button></div></div>
    <div class="grid kpis">
      <div class="kpi"><span class="eyebrow">Accounts</span><b>${fmt(t.people)}</b></div>
      <div class="kpi"><span class="eyebrow">Posted today</span><b>${fmt(t.active_today)}</b></div>
      <div class="kpi"><span class="eyebrow">Posts</span><b>${fmt(t.posts)}</b></div>
      <div class="kpi"><span class="eyebrow">Messages</span><b>${fmt(t.messages)}</b></div>
      <div class="kpi"><span class="eyebrow">Friendships</span><b>${fmt(t.friendships)}</b></div>
      <div class="kpi"><span class="eyebrow">Live challenges</span><b>${fmt(t.live_challenges)}</b></div>
      <div class="kpi ${t.open_reports ? "alert" : ""}"><span class="eyebrow">To review</span><b>${fmt(t.open_reports)}</b></div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); margin-top:14px">
      ${bars(d, "signups", "Sign-ups")}${bars(d, "active", "People posting")}${bars(d, "posts", "Posts")}${bars(d, "messages", "Messages")}
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); margin-top:14px">
      ${miniList("Starting soon", upcoming, c => `starts ${dayLabel(c.starts_on)}`)}
      ${miniList("Ending in 3 days or less", endingSoon, c => `ends ${dayLabel(c.ends_on)}`)}
      ${miniList("Drafts", drafts, c => "not live yet")}
    </div>
    <p class="muted small" style="margin-top:14px">Days are Hong Kong time.</p>`;
  $("#ovNew").onclick = () => { openTab("challenges"); setTimeout(() => editChallenge(null), 50); };
  $$("[data-open]", el).forEach(a => a.onclick = () => { openTab("challenges"); setTimeout(() => editChallenge(challenges.find(c => c.id === a.dataset.open)), 300); });
}
function miniList(title, items, sub) {
  return `<div class="card"><div class="eyebrow" style="margin-bottom:8px">${title}</div>
    ${items.length ? items.slice(0, 6).map(c => `<div class="row" style="padding:8px 0; border-bottom:1px solid var(--hair); cursor:pointer" data-open="${esc(c.id)}"><b>${esc(c.title)}</b><span class="space"></span><span class="muted small">${sub(c)}</span></div>`).join("") : '<div class="muted small">Nothing here.</div>'}</div>`;
}

// ---------------- Challenges ----------------
let challenges = [], sponsors = [], counts = {}, chFilter = "all", chSearch = "", chBrand = null;
async function fetchSponsors() {
  const { data, error } = await sb.from("sponsors").select("*").order("name"); if (error) throw error;
  sponsors = data;
}
function stateOf(c) {
  const t = todayISO();
  if (c.status === "draft") return "draft";
  if (c.status === "ended" || c.ends_on < t) return "ended";
  if (c.starts_on > t) return "scheduled";
  return "live";
}
const STATE_LABEL = { live:"Live", scheduled:"Scheduled", draft:"Draft", ended:"Ended" };
async function loadChallenges() {
  const el = $("#tab-challenges");
  await fetchSponsors();
  const [{ data, error }, cnt] = await Promise.all([
    sb.from("challenges").select("*").order("starts_on", { ascending: false }), sb.rpc("challenge_counts")]);
  if (error) throw error;
  challenges = data; counts = Object.fromEntries((cnt.data || []).map(c => [c.challenge_id, c.joined]));
  renderChallengeList();
}
function renderChallengeList() {
  const el = $("#tab-challenges");
  const sp = id => sponsors.find(s => s.id === id);
  const byState = s => challenges.filter(c => stateOf(c) === s).length;
  const brandKey = c => c.sponsor_id || "performative";
  const rows = challenges.filter(c => (chFilter === "all" || stateOf(c) === chFilter) && (!chBrand || brandKey(c) === chBrand)
    && (!chSearch || (c.title + " " + c.id + " " + (sp(c.sponsor_id)?.name || "")).toLowerCase().includes(chSearch.toLowerCase())));
  el.innerHTML = `
    <div class="pagehead"><div><h1>Challenges</h1><p>What everyone can join in the app. Changes reach phones within seconds.</p></div>
      <button class="btn" id="newChallenge">＋ New challenge</button></div>
    <div class="shelf" id="chShelf">
      ${[{ id:"performative", name:"Performative", color:"#0A0A0A", tint:"#EDEDEA" }, ...sponsors].filter(b => challenges.some(c => brandKey(c) === b.id)).map(b => {
        const n = challenges.filter(c => brandKey(c) === b.id).length, on = chBrand === b.id, dim = chBrand && !on;
        return `<button class="brandchip ${on ? "on" : ""} ${dim ? "dim" : ""}" data-brand="${esc(b.id)}" title="${esc(b.name)}">
          <span class="disc" style="background:${esc(b.tint || "#EDEDEA")}; ${on ? `box-shadow:0 0 0 2px ${esc(b.color)}` : ""}">${b.logo_path ? `<img src="${logoURL(b.logo_path)}" alt="">` : `<b style="color:${esc(b.color)}">${esc((b.wordmark || b.name)[0])}</b>`}</span>
          <span class="nm">${esc(b.name)}</span><span class="ct">${n}</span></button>`; }).join("")}
    </div>
    <div class="toolbar">
      <div class="segs" id="chSegs">${["all","live","scheduled","draft","ended"].map(s => `<button data-s="${s}" class="${chFilter === s ? "on" : ""}">${s === "all" ? "All" : STATE_LABEL[s]} <span class="muted">${s === "all" ? challenges.length : byState(s)}</span></button>`).join("")}</div>
      <span class="space"></span>
      <div class="search"><input type="search" id="chSearch" placeholder="Search challenges or sponsors" value="${esc(chSearch)}"></div>
    </div>
    <div class="card" style="padding:6px 8px">
      ${rows.length ? `<table><thead><tr><th>Challenge</th><th>Runs</th><th>Where</th><th>Sponsor</th><th>Joined</th><th>Status</th></tr></thead><tbody>
      ${rows.map(c => { const s = sp(c.sponsor_id), st = stateOf(c); return `<tr class="click" data-id="${esc(c.id)}">
        <td><div class="row" style="gap:10px; flex-wrap:nowrap"><span class="swatch" style="width:10px;height:36px;border-radius:4px;background:${esc(s?.color || "#0A0A0A")}"></span>
          <div><b>${esc(c.title)}</b>${c.featured_on ? ` <span class="pill dark">${slotLabel(c.featured_on)}</span>` : ""}<div class="muted small">${esc(c.rule)}</div></div></div></td>
        <td>${dayLabel(c.starts_on)} – ${dayLabel(c.ends_on)}<div class="muted small">${daysBetween(c.starts_on, c.ends_on) + 1} days</div></td>
        <td>${flag(c.region)} ${esc(countryName(c.region))}</td>
        <td>${s ? `<span class="swatch" style="background:${esc(s.color)}"></span> ${esc(s.name)}` : '<span class="muted">Performative</span>'}</td>
        <td>${fmt(counts[c.id])}${c.capacity ? `<span class="muted"> / ${fmt(c.capacity)}</span>` : ""}</td>
        <td><span class="pill ${st}">${STATE_LABEL[st]}</span></td></tr>`; }).join("")}
      </tbody></table>` : `<div class="empty">No challenges here${chBrand ? " for this brand" : ""}. <a href="#" id="emptyNew">Make one</a>.</div>`}
    </div>`;
  $("#newChallenge").onclick = () => editChallenge(null);
  $("#emptyNew")?.addEventListener("click", e => { e.preventDefault(); editChallenge(null); });
  $$("#chSegs button").forEach(b => b.onclick = () => { chFilter = b.dataset.s; renderChallengeList(); });
  $$("#chShelf [data-brand]").forEach(b => b.onclick = () => { chBrand = chBrand === b.dataset.brand ? null : b.dataset.brand; renderChallengeList(); });
  $("#chSearch").oninput = e => { chSearch = e.target.value; const pos = e.target.selectionStart; renderChallengeList(); const i = $("#chSearch"); i.focus(); i.setSelectionRange(pos, pos); };
  $$("tr.click", el).forEach(tr => tr.onclick = () => editChallenge(challenges.find(c => c.id === tr.dataset.id)));
}
function slugify(s) { return s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40); }

// The challenge editor: one page, in clear sections, with the phone preview beside it.
function editChallenge(orig) {
  const isNew = !orig;
  const t = todayISO();
  let c = orig ? structuredClone(orig) : { id:"", title:"", rule:"", group_name:"Exercise", categories:["Running"], metric:"time", daily_target:20,
    starts_on: addDays(t, 1), ends_on: addDays(t, 7), sponsor_id:null, region:null, capacity:null, featured_on:null,
    steps:["Do it every day.", "Post a live photo when you're done.", "Ranked by total."], status:"draft", joined_base:0,
    notify_start:true, reminder_time:"18:00:00", notify_ending:true, notify_results:true, announcement:"", cover_note:"" };
  const el = $("#tab-challenges");
  const sections = [["basics","Basics"],["schedule","When"],["goal","Daily target"],["audience","Who can join"],["look","Sponsor & look"],["how","How it works"],["notify","Notifications"]];
  el.innerHTML = `
    <div class="pagehead"><div><a href="#" id="back" class="muted small" style="text-decoration:none">← All challenges</a>
      <h1 style="margin-top:6px">${isNew ? "New challenge" : esc(c.title)}</h1>
      <p>${isNew ? "Fill in each section. It stays a draft until you publish." : `<span class="pill ${stateOf(c)}">${STATE_LABEL[stateOf(c)]}</span> · ${fmt(counts[c.id])} joined · last edited ${when(c.updated_at)}`}</p></div></div>
    <div class="editor">
      <nav class="steps">${sections.map(([id, l], i) => `<a href="#" data-sec="${id}" id="nav-${id}"><span class="n">${i + 1}</span>${l}</a>`).join("")}</nav>
      <form id="cForm" novalidate>
        <div class="card section" id="sec-basics"><h3>Basics</h3><p>What people see on the card.</p>
          <label class="f"><span>Title</span><input type="text" name="title" maxlength="40" placeholder="e.g. Run Week" value="${esc(c.title)}"><div class="err" data-err="title"></div></label>
          <label class="f"><span>Rule <small>· the one line under the title</small></span><input type="text" name="rule" maxlength="60" placeholder="e.g. Run 3 km a day" value="${esc(c.rule)}"><div class="err" data-err="rule"></div></label>
          <div class="two">
            <label class="f"><span>Area</span><select name="group_name">${GROUPS.map(g => `<option ${c.group_name === g ? "selected" : ""}>${g}</option>`).join("")}</select></label>

          ${!isNew && c.status === "live" ? `<button type="button" class="btn ghost" id="cEnd">End now</button>` : ""}
          <button type="button" class="btn ghost" id="cDraft">${isNew || c.status === "draft" ? "Save draft" : "Move to draft"}</button>

  const form = $("#cForm");
  const setSeg = (id, key, val) => $$(`#${id} button`).forEach(b => b.classList.toggle("on", b.dataset[key] === String(val)));

  // Activities
  function drawCats() {
    const list = [...new Set([...(CATEGORIES[c.group_name] || []), ...ALL_CATEGORIES])];
    $("#catChips").innerHTML = list.map(k => `<button type="button" class="chip ${c.categories.includes(k) ? "on" : ""}" data-k="${esc(k)}">${esc(k)}</button>`).join("");
    $$("#catChips .chip").forEach(b => b.onclick = () => {
      const k = b.dataset.k; c.categories = c.categories.includes(k) ? c.categories.filter(x => x !== k) : [...c.categories, k];
      drawCats(); refresh();
    });
  }
  // Schedule
  function drawSchedule() {
    const n = daysBetween(c.starts_on, c.ends_on) + 1;
    setSeg("lenSegs", "len", [7, 14, 21, 30].includes(n) ? n : "custom");
    const startsIn = daysBetween(t, c.starts_on);
    $("#schedHelp").textContent = n > 0 ? `${n} days · ${startsIn > 0 ? `starts in ${startsIn} day${startsIn === 1 ? "" : "s"}` : startsIn === 0 ? "starts today" : "already started"} · ends ${new Date(c.ends_on + "T00:00:00").toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" })}` : "";
  }
  $$("#lenSegs button").forEach(b => b.onclick = () => {
    if (b.dataset.len === "custom") { form.ends_on.focus(); return; }
    c.ends_on = addDays(c.starts_on, Number(b.dataset.len) - 1); form.ends_on.value = c.ends_on; drawSchedule(); refresh();
  });
  // Metric
  function drawMetric() {
    setSeg("metricSegs", "m", c.metric);
    const m = METRICS[c.metric]; $("#targetUnit").textContent = m.unit; form.daily_target.step = m.step; form.daily_target.placeholder = m.eg;
    $("#metricHelp").textContent = c.metric === "time" ? "From the app's timer: sessions of the activities above." : c.metric === "km" ? "From Apple Health workouts (running, walking, cycling)." : "From Apple Health's step count for the day.";
  }
  $$("#metricSegs button").forEach(b => b.onclick = () => { c.metric = b.dataset.m; c.daily_target = METRICS[c.metric].def; form.daily_target.value = c.daily_target; drawMetric(); refresh(); });
  // Where
  function drawWhere() { setSeg("whereSegs", "w", c.region ? "country" : "world"); $("#countryBox").classList.toggle("hidden", !c.region && !$("#countryBox")._open); }
  $$("#whereSegs button").forEach(b => b.onclick = () => {
    if (b.dataset.w === "world") { c.region = null; $("#countryBox")._open = false; $("#countryInput").value = ""; }
    else { $("#countryBox")._open = true; if (!c.region) setTimeout(() => $("#countryInput").focus(), 0); }
    drawWhere(); refresh();
  });
  const pickCountry = code => { c.region = code; $("#countryInput").value = flag(code) + " " + countryName(code); $("#countryList").classList.add("hidden"); drawWhere(); refresh(); };
  $("#countryInput").addEventListener("input", e => {
    const q = e.target.value.replace(/[^\p{L}\s]/gu, "").trim().toLowerCase();
    const hits = COUNTRIES.filter(x => !q || x.name.toLowerCase().includes(q) || x.code.toLowerCase() === q).slice(0, 40);
    const list = $("#countryList"); list.classList.remove("hidden");
    list.innerHTML = hits.map(x => `<button type="button" data-c="${x.code}">${flag(x.code)} <span>${esc(x.name)}</span><span class="space"></span><span class="muted small">${x.code}</span></button>`).join("") || '<div class="muted small" style="padding:8px">No match</div>';
    $$("button", list).forEach(b => b.onclick = () => pickCountry(b.dataset.c));
  });
  $("#countryInput").addEventListener("focus", e => e.target.dispatchEvent(new Event("input")));
  document.addEventListener("click", e => { if (!e.target.closest("#countryBox")) $("#countryList")?.classList.add("hidden"); }, { once:false });
  $$("#popular .chip").forEach(b => b.onclick = () => pickCountry(b.dataset.c));
  // Steps
  function drawSteps() {
    $("#stepsList").innerHTML = c.steps.map((s, i) => `<div class="stepsrow"><span class="num">${i + 1}</span>
      <input type="text" data-i="${i}" value="${esc(s)}" maxlength="120">
      <button type="button" class="iconbtn" data-up="${i}" title="Move up">↑</button><button type="button" class="iconbtn" data-down="${i}" title="Move down">↓</button>
      <button type="button" class="iconbtn" data-del="${i}" title="Remove">✕</button></div>`).join("") || '<div class="muted small" style="margin-bottom:10px">No steps yet.</div>';
    $$("#stepsList input").forEach(inp => inp.oninput = () => { c.steps[inp.dataset.i] = inp.value; refresh(false); });
    $$("[data-up]").forEach(b => b.onclick = () => { const i = +b.dataset.up; if (i > 0) { [c.steps[i - 1], c.steps[i]] = [c.steps[i], c.steps[i - 1]]; drawSteps(); refresh(); } });
    $$("[data-down]").forEach(b => b.onclick = () => { const i = +b.dataset.down; if (i < c.steps.length - 1) { [c.steps[i + 1], c.steps[i]] = [c.steps[i], c.steps[i + 1]]; drawSteps(); refresh(); } });
    $$("[data-del]").forEach(b => b.onclick = () => { c.steps.splice(+b.dataset.del, 1); drawSteps(); refresh(); });
  }
  $("#addStep").onclick = () => { c.steps.push(""); drawSteps(); $$("#stepsList input").at(-1).focus(); };

  // Read the plain fields, check everything, update the preview and section ticks.
  function read() {
    const f = new FormData(form);
    c.title = (f.get("title") || "").trim(); c.rule = (f.get("rule") || "").trim(); c.group_name = f.get("group_name");
    c.id = isNew ? (f.get("id") || "").trim() : c.id;
    c.starts_on = f.get("starts_on"); c.ends_on = f.get("ends_on");
    c.daily_target = Number(f.get("daily_target")); c.capacity = f.get("capacity") ? Number(f.get("capacity")) : null;
    c.sponsor_id = f.get("sponsor_id") || null; c.featured_on = f.get("featured_on") || null;
    c.cover_note = (f.get("cover_note") || "").trim(); c.announcement = (f.get("announcement") || "").trim();
    c.notify_start = f.get("notify_start") === "on"; c.notify_ending = f.get("notify_ending") === "on"; c.notify_results = f.get("notify_results") === "on";
    c.reminder_time = f.get("reminder_time") ? f.get("reminder_time") + ":00" : null;
  }
  function problems() {
    const p = {};
    if (!c.title) p.title = "Give it a title.";
    if (!c.rule) p.rule = "Add the one-line rule.";
    if (!/^[a-z0-9-]{3,40}$/.test(c.id)) p.id = "3–40 characters: lowercase letters, numbers and dashes.";
    else if (isNew && challenges.some(x => x.id === c.id)) p.id = "That id is taken. Change it a little.";
    if (!c.categories.length) p.categories = "Pick at least one activity.";
    if (!c.starts_on || !c.ends_on || c.ends_on < c.starts_on) p.dates = "The end has to be on or after the start.";
    if (!(c.daily_target > 0)) p.target = "Set a target above 0.";
    return p;
  }
  const sectionOf = { title:"basics", rule:"basics", id:"basics", categories:"basics", dates:"schedule", target:"goal" };
  function refresh(redrawSteps = true) {
    read();
    const p = problems();
    $$("[data-err]", form).forEach(e => e.textContent = form._tried ? (p[e.dataset.err] || "") : "");
    sections.forEach(([id]) => {
      const bad = Object.keys(p).some(k => sectionOf[k] === id);
      $("#nav-" + id).classList.toggle("bad", !!(form._tried && bad)); $("#nav-" + id).classList.toggle("ok", !bad);
    });
    $("#saveState").textContent = Object.keys(p).length ? `${Object.keys(p).length} thing${Object.keys(p).length > 1 ? "s" : ""} to fix` : "Ready to publish";
    drawPreview();
  }
  // The spots this challenge could take, and which are already booked for its dates.
  function drawFeat() {
    const sel = $("#featSel"); if (!sel) return;
    const clash = slot => challenges.find(x => x.id !== c.id && x.featured_on === slot && ["live", "draft"].includes(x.status) && x.starts_on <= c.ends_on && x.ends_on >= c.starts_on);
    const opts = [["", "Not featured"], ["all", "Main page (premium)"], [c.group_name, `${c.group_name} page`]];
    sel.innerHTML = opts.map(([v, l]) => { const k = v && clash(v); return `<option value="${v}" ${(c.featured_on || "") === v ? "selected" : ""} ${k ? "disabled" : ""}>${l}${k ? ` · booked by ${esc(k.title)}` : ""}</option>`; }).join("");
    if (c.featured_on && c.featured_on !== "all" && c.featured_on !== c.group_name) sel.insertAdjacentHTML("beforeend", `<option value="${c.featured_on}" selected>${c.featured_on} page</option>`);
    $("#featHelp").textContent = c.featured_on === "all" ? "Shown at the top of Challenges for everyone." : c.featured_on ? `Shown at the top when people tap ${c.featured_on}.` : "";
  }
  function drawPreview() {
    drawFeat();
    const s = sponsors.find(x => x.id === c.sponsor_id);
    const color = s?.color || "#0A0A0A", tint = s?.tint || "#F2F2F2";
    const days = daysBetween(c.starts_on, c.ends_on) + 1, m = METRICS[c.metric];
    const logo = s?.logo_path ? `<img src="${logoURL(s.logo_path)}">` : "";
    const firstName = "Alex";
    $("#cPreview").innerHTML = `<div class="phone"><div class="screen"><div class="status"><span>9:41</span><span>●●● ▮</span></div><div class="scroll">
      <div style="font-family:'Instrument Serif'; font-size:26px; margin:2px 0 10px">Challenges</div>
      <div class="pcard" style="background:${esc(color)}">
        <div class="wm">${logo}${esc(s ? (s.wordmark || s.name).toUpperCase() : "PERFORMATIVE")}${c.featured_on ? " · FEATURED" : ""}</div>
        <div><h4>${esc(c.title || "Challenge title")}</h4>
          <div class="meta">${esc(c.rule || "The daily rule")} · ${days} days · ${c.region ? flag(c.region) + " " + esc(countryName(c.region)) : "🌍 Worldwide"}</div>
          <div class="meta" style="margin-top:3px">${fmt(counts[c.id] || 0)} in${c.capacity ? ` · ${fmt(c.capacity)} spots` : ""} · ${dayLabel(c.starts_on)} – ${dayLabel(c.ends_on)}</div></div>
        <span class="join">Join</span>
      </div>
      ${c.cover_note ? `<div class="ptint" style="background:${esc(tint)}; font-size:12px"><b>${esc(c.cover_note)}</b></div>` : ""}
      <div class="plist"><div class="eyebrow" style="display:block; margin-bottom:8px">How it works</div>
        ${(c.steps.filter(Boolean).length ? c.steps.filter(Boolean) : ["Steps show here"]).map((st, i) => `<div><span>${i + 1}</span>${esc(st)}</div>`).join("")}
        <div><span>✓</span>${c.daily_target || "?"} ${m.unit} · ${esc(c.categories.join(", ") || "pick activities")}</div></div>
      <div class="eyebrow" style="margin:16px 0 4px">Notifications</div>
      ${c.notify_start ? `<div class="notif"><b>PERFORMATIVE · ${dayLabel(c.starts_on)}, 9:00</b>${esc(c.title || "Your challenge")} starts today. ${esc(c.announcement || "")}</div>` : ""}
      ${c.reminder_time ? `<div class="notif"><b>DAILY · ${c.reminder_time.slice(0, 5)}</b>${esc(c.rule || "Today's target")}: not done yet today, ${firstName}.</div>` : ""}
      ${c.notify_ending ? `<div class="notif"><b>${dayLabel(addDays(c.ends_on, -2))}, 9:00</b>2 days left in ${esc(c.title || "the challenge")}.</div>` : ""}
      ${c.notify_results ? `<div class="notif"><b>${dayLabel(addDays(c.ends_on, 1))}, 9:00</b>${esc(c.title || "The challenge")} is over. See how you did.</div>` : ""}
      ${!c.notify_start && !c.reminder_time && !c.notify_ending && !c.notify_results ? '<div class="muted small">None</div>' : ""}
    </div></div></div>`;
  }

  // Wiring
  form.addEventListener("input", e => {
    if (isNew && e.target.name === "title") form.id.value = slugify(e.target.value);
    if (e.target.name === "starts_on" && c.ends_on) { const len = daysBetween(c.starts_on, c.ends_on); read(); c.ends_on = addDays(c.starts_on, Math.max(0, len)); form.ends_on.value = c.ends_on; }
    if (e.target.name === "group_name") { read(); drawCats(); }
    refresh(); drawSchedule();
  });
  form.addEventListener("change", () => refresh());
  $$(".steps a").forEach(a => a.onclick = e => { e.preventDefault(); $("#sec-" + a.dataset.sec).scrollIntoView({ behavior:"smooth" }); });
  $("#back").onclick = e => { e.preventDefault(); renderChallengeList(); };
  $("#toSponsors").onclick = e => { e.preventDefault(); openTab("sponsors"); };

  async function save(status) {
    read(); form._tried = true; const p = problems(); refresh();
    if (Object.keys(p).length) { const k = Object.keys(p)[0]; $("#sec-" + sectionOf[k]).scrollIntoView({ behavior:"smooth" }); return toast("Fix the highlighted bits first.", true); }
    const row = { ...c, status, steps: c.steps.map(s => s.trim()).filter(Boolean), cover_note: c.cover_note || null, announcement: c.announcement || null };
    delete row.updated_at; delete row.created_at;
    try {
      delete row.featured;   // the database sets it from featured_on
      const { error } = isNew ? await sb.from("challenges").insert(row) : await sb.from("challenges").update(row).eq("id", row.id);
      if (error) throw error;
      toast(status === "live" ? (isNew || orig?.status !== "live" ? "Published. It's in the app now." : "Saved. Phones update within seconds.") : status === "ended" ? "Ended." : "Saved as a draft.");
      await loadChallenges(); editChallenge(challenges.find(x => x.id === row.id));
    } catch (err) { if (String(err.message).includes("featured spot")) { $("[data-err=featured]").textContent = err.message; $("#sec-look").scrollIntoView({ behavior:"smooth" }); }
      fail(err.code === "23505" ? { message:"A challenge with that id already exists." } : err); }
  }
  $("#cPublish").onclick = () => save("live");
  $("#cDraft").onclick = () => save("draft");
  $("#cEnd")?.addEventListener("click", () => { if (confirm("End this challenge now? It leaves the app; the sponsor's report keeps the numbers.")) save("ended"); });
  $("#cDelete")?.addEventListener("click", async () => {
    if (!confirm(`Delete "${c.title}" for good? Everyone in it leaves and the sponsor's report for it goes too. To keep the numbers, use End instead.`)) return;
    const { error } = await sb.from("challenges").delete().eq("id", c.id); if (error) return fail(error);
    toast("Deleted"); await loadChallenges();
  });

  drawCats(); drawSteps(); drawMetric(); drawWhere(); drawSchedule(); refresh();
  window.scrollTo(0, 0);
}

        <div class="band" style="background:${esc(s.color)}">${s.logo_path ? `<img src="${logoURL(s.logo_path)}" style="width:26px;height:26px;border-radius:7px;background:#fff;object-fit:contain;margin-right:8px">` : ""}${esc((s.wordmark || s.name).toUpperCase())}</div>
        <div class="row"><b>${esc(s.name)}</b>${s.is_sample ? '<span class="pill">sample</span>' : ""}<span class="space"></span></div>
        <div class="muted small" style="margin-top:4px">${live(s.id)} live challenge${live(s.id) === 1 ? "" : "s"} · <span class="swatch" style="background:${esc(s.color)}"></span> ${esc(s.color)}</div>
      </div>`).join("")}

// Colour maths: hex ↔ HSL, the light tint, and WCAG contrast of white text on the brand colour.
const hexToRgb = h => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgbToHex = (r, g, b) => "#" + [r, g, b].map(x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, "0")).join("").toUpperCase();

// A colour field: wheel (hue around, white in the middle), lightness slider, hex box, system picker, eyedropper, swatches.
function colorField(name, value, opts = {}) {
  return `<div class="colorfield" data-name="${name}">
    <div class="row" style="align-items:flex-start; gap:16px; flex-wrap:wrap">
      <div class="wheel" data-wheel><span class="dot" data-dot></span></div>
      <div style="flex:1; min-width:200px">
        <div class="colorrow"><input type="color" data-native value="${esc(value)}" title="Open the colour picker"><input type="text" name="${name}" value="${esc(value)}" maxlength="7" pattern="#[0-9A-Fa-f]{6}">

        <div class="flabel" style="margin-top:12px">Lightness</div><input type="range" class="light" data-light min="5" max="95" value="50">

        <div class="help" data-drophelp></div>

    </div></div>`;
}
function wireColorField(root, onChange) {
  const text = $("input[type=text]", root), native = $("[data-native]", root), wheel = $("[data-wheel]", root), dot = $("[data-dot]", root), light = $("[data-light]", root);
  let hsl = rgbToHsl(...(hexToRgb(text.value) || [10, 10, 10]));
  const place = () => { const r = 90, a = (hsl[0] - 90) * Math.PI / 180, d = hsl[1] * r; dot.style.left = (r + Math.cos(a) * d) + "px"; dot.style.top = (r + Math.sin(a) * d) + "px"; dot.style.background = text.value; };
  const paintLight = () => { const mid = rgbToHex(...hslToRgb(hsl[0], hsl[1], .5)); light.style.background = `linear-gradient(90deg, #000, ${mid}, #fff)`; light.value = Math.round(hsl[2] * 100); };
  const set = (hex, from) => { hex = hex.toUpperCase(); if (!/^#[0-9A-F]{6}$/.test(hex)) return; text.value = hex; native.value = hex;
    if (from !== "hsl") hsl = rgbToHsl(...hexToRgb(hex)); place(); paintLight(); onChange(hex); };
  root._set = set;
  const fromPoint = e => { const b = wheel.getBoundingClientRect(), x = e.clientX - b.left - b.width / 2, y = e.clientY - b.top - b.height / 2;
    hsl[0] = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360; hsl[1] = Math.min(1, Math.hypot(x, y) / (b.width / 2)); if (hsl[2] > .9 || hsl[2] < .1) hsl[2] = .5;

  wheel.addEventListener("pointerup", () => wheel.onpointermove = null);

  native.oninput = () => set(native.value);
  text.oninput = () => { if (/^#[0-9A-Fa-f]{6}$/.test(text.value)) set(text.value); };
  $("[data-drop]", root).onclick = async () => {
    if (!("EyeDropper" in window)) { $("[data-drophelp]", root).textContent = "The screen dropper works in Chrome and Edge. In Safari, use the colour box: its picker has a magnifier to pick from the screen."; native.click(); return; }
    try { const r = await new EyeDropper().open(); set(r.sRGBHex.length === 7 ? r.sRGBHex : rgbToHex(...(r.sRGBHex.match(/\d+/g) || []).map(Number))); } catch {}
  };

}
// The main colours in a logo (skipping near-white, near-black and see-through pixels).
function logoColours(img) {
  const c = document.createElement("canvas"), n = 48; c.width = n; c.height = n; const x = c.getContext("2d"); x.drawImage(img, 0, 0, n, n);
  let d; try { d = x.getImageData(0, 0, n, n).data; } catch { return []; }
  const buckets = {};
  for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 128) continue; const [r, g, b] = [d[i], d[i + 1], d[i + 2]]; const l = (r + g + b) / 3; if (l > 240 || l < 15) continue;
    const k = [r, g, b].map(v => Math.round(v / 32) * 32).join(","); (buckets[k] ||= { n:0, r:0, g:0, b:0 }); const q = buckets[k]; q.n++; q.r += r; q.g += g; q.b += b; }
  return Object.values(buckets).sort((a, b) => b.n - a.n).slice(0, 6).map(q => rgbToHex(q.r / q.n, q.g / q.n, q.b / q.n));
}

      : '<div class="empty">Nothing to review. 🎉</div>'}</div>`;
  $$(".segs button", el).forEach(b => b.onclick = () => loadReports(b.dataset.r === "1").catch(fail));

function reportDates(c) {

}
async function drawReportRows(s, priv) {

  const ids = (list || []).map(c => c.id);
  const { data: sent } = ids.length ? await sb.from("sponsor_report_emails").select("*").in("challenge_id", ids).order("sent_at", { ascending:false }) : { data: [] };
  const last = (id, kind) => (sent || []).find(r => r.challenge_id === id && r.kind === kind && r.mode !== "preview");
  const cell = (c, kind, due) => {
    if (!due) return '<span class="muted small">Too short for halftime</span>';
    const r = last(c.id, kind);
    if (r) return `<span class="pill live">Sent</span><div class="muted small" style="margin-top:4px">${when(r.sent_at)}${r.mode === "manual" ? " · by hand" : ""}</div>`;

// Price = set-up + featured fee + (expected participants × active days each × rate) × country premium, never below the minimum.
const PRICE_DEFAULTS = { baseJoin: 8, featuredBoost: 2.2, featuredFee: 18000, featuredPremium: 1.6, areaBoost: 1.35, areaFee: 4500, areaPremium: 1.15,
  lengthDrag: 0.3, halfLife: 10, rate: 1.2, setup: 2500, countryPremium: 1.2, minimum: 5000, round: 500 };
let priceAssume = { ...PRICE_DEFAULTS };
let audience = null;
const pq = { from:"", region:null, basis:"all", growth:0, days:14, cap:"", slot:"" };
const HKD_PER_USD = 7.8;
const whole = x => Math.round(Number(x) || 0).toLocaleString("en-GB");
const money = (x, cur = "HK$") => cur + Math.round(x).toLocaleString("en-GB");

function audienceFor(region, basis) {
  if (!audience) return 0;
  if (!region) return basis === "active" ? audience.active_30d : audience.total;
  const r = audience.regions.find(x => x.region === region);
  return r ? (basis === "active" ? r.active_30d : r.people) : 0;
}
function priceModel(q, a) {
  const L = Math.max(1, Number(q.days) || 1);
  const N0 = audienceFor(q.region, q.basis);
  const N = N0 * (1 + (Number(q.growth) || 0) / 100);
  const tier = q.slot === "all" ? { boost: a.featuredBoost, fee: a.featuredFee, prem: a.featuredPremium } : q.slot ? { boost: a.areaBoost, fee: a.areaFee, prem: a.areaPremium } : { boost: 1, fee: 0, prem: 1 };
  const p = (a.baseJoin / 100) * tier.boost * Math.pow(7 / L, a.lengthDrag);
  const cap = Number(q.cap) > 0 ? Number(q.cap) : Infinity;
  const E = { low: Math.min(cap, N * p * 0.5), mid: Math.min(cap, N * p), high: Math.min(cap, N * p * 1.5) };
  const A = a.halfLife * (1 - Math.exp(-L / a.halfLife));
  const fees = a.setup + tier.fee;
  const m = (q.region ? a.countryPremium : 1) * tier.prem;
  const raw = k => fees + E[k] * A * a.rate * m;
  const round = x => Math.max(a.minimum, Math.ceil(x / a.round) * a.round);
  return { L, N0, N, p, cap, E, A, fees, m, tier, raw: { low: raw("low"), mid: raw("mid"), high: raw("high") },
    price: { low: round(raw("low")), mid: round(raw("mid")), high: round(raw("high")) }, floor: raw("mid") < a.minimum };
}
function measuredJoinRate() {
  if (!audience) return null;
  const rows = audience.challenges.filter(c => c.starts_on <= todayISO() && audienceFor(c.region, "all") > 0);
  if (!rows.length) return null;
  const joined = rows.reduce((t, c) => t + c.joined, 0), pool = rows.reduce((t, c) => t + audienceFor(c.region, "all"), 0);
  return { rate: joined / pool * 100, n: rows.length };
}

    $("#pqAudienceLine").textContent = `Audience now: ${whole(m.N0)} ${pq.basis === "active" ? "active accounts" : "accounts"} (${place})${Number(pq.growth) ? `, about ${whole(m.N)} by the start` : ""}. Across the app: ${whole(audience.total)} accounts, ${whole(audience.active_30d)} posted in the last 30 days, ${whole(audience.new_30d)} joined in the last 30 days.`;
    const meas = measuredJoinRate();
    $("#pqMeasured").innerHTML = meas ? `Measured so far: <b>${meas.rate.toFixed(1)}%</b> of accounts joined, across ${meas.n} challenge${meas.n === 1 ? "" : "s"} (uses today's account numbers, so it's rough). <a href="#" id="pqUseMeasured">Use it</a>`
      : "No challenges have run yet, so the join rate is a starting guess. Once a few have run, the measured rate shows here.";
    $("#pqUseMeasured")?.addEventListener("click", e => { e.preventDefault(); priceAssume.baseJoin = Math.round(meas.rate * 10) / 10; saveAssume(); loadPricing(); });

    const capTxt = m.cap === Infinity ? "no limit" : whole(m.cap);
    $("#pqFormula").textContent =
`Join chance   p = ${a.baseJoin}%${pq.slot ? ` × ${m.tier.boost} featured` : ""} × (7 ÷ ${m.L} days)^${a.lengthDrag}  =  ${(m.p * 100).toFixed(2)}%
Participants  E = min(spots, audience × p) = min(${capTxt}, ${whole(m.N)} × ${(m.p * 100).toFixed(2)}%)  =  ${whole(m.E.mid)}
Active days   A = ${a.halfLife} × (1 − e^(−${m.L} ÷ ${a.halfLife}))  =  ${m.A.toFixed(1)} days each
Price         = HK$${whole(m.fees)} fees + ${whole(m.E.mid)} × ${m.A.toFixed(1)} × HK$${a.rate}${pq.region ? ` × ${a.countryPremium} country` : ""}${pq.slot ? ` × ${m.tier.prem} featured` : ""}  =  ${money(m.raw.mid)}
Quote         = rounded up to HK$${whole(a.round)}, at least HK$${whole(a.minimum)}  =  ${money(m.price.mid)}`;
    const rows = [
      ["Audience", `${whole(m.N)} accounts`], ["Chance each joins", `${(m.p * 100).toFixed(2)}%`],
      ["Expected participants", `${whole(m.E.low)} – ${whole(m.E.high)} (likely ${whole(m.E.mid)})`],
      ["Active days per participant", `${m.A.toFixed(1)} of ${m.L}`], ["Active participant-days", whole(m.E.mid * m.A)],
      ["Set-up and placement fees", money(m.fees)], ["Participation", money(m.raw.mid - m.fees)],
    ];
    $("#pqBreakdown").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");

    const per = m.E.mid > 0 ? m.price.mid / m.E.mid : null, perDay = m.E.mid > 0 ? m.price.mid / (m.E.mid * m.A) : null;
    $("#pqQuote").innerHTML = `<div class="eyebrow" style="color:#a8a8a8">Suggested price</div>
      <div class="big">${money(m.price.mid)}</div>
      <div class="muted">≈ ${money(m.price.mid / HKD_PER_USD, "US$")} · range ${money(m.price.low)} – ${money(m.price.high)}</div>
      ${m.floor ? '<div class="small" style="margin-top:8px; color:#ffd27a">The minimum applies: the audience is still small.</div>' : ""}
      <div class="qgrid">
        <div><b>${whole(m.E.mid)}</b><span>likely participants</span></div>
        <div><b>${whole(m.E.mid * m.A)}</b><span>active participant-days</span></div>
        <div><b>${per ? money(per) : "—"}</b><span>per participant</span></div>
        <div><b>${perDay ? "HK$" + perDay.toFixed(2) : "—"}</b><span>per active day</span></div>
      </div>
      <button class="btn white" style="width:100%; justify-content:center; margin-top:16px" id="pqCopy">Copy quote for the sponsor</button>
      <p class="small muted" style="margin:10px 0 0">A guide, not a promise: the range shows half to one and a half times the likely number of participants.</p>`;
    $("#pqCopy").onclick = async () => {
      const text = `Performative sponsored challenge: quote

Challenge: ${pq.from ? (challenges.find(c => c.id === pq.from)?.title || "") : "To be named"}
Length: ${m.L} days${pq.slot === "all" ? ", featured on the main Challenges page" : pq.slot ? `, featured on the ${pq.slot} page` : ""}
Audience: ${pq.region ? countryName(pq.region) + " only" : "Worldwide"}${m.cap !== Infinity ? `, capped at ${whole(m.cap)} participants` : ""}

Expected participants: ${whole(m.E.low)} to ${whole(m.E.high)}
Price: ${money(m.price.mid)} (about ${money(m.price.mid / HKD_PER_USD, "US$")})

Included: your branded challenge card${pq.slot ? " in the featured spot" : ""}, logo and brand colours, start, reminder and results notifications to participants, a live report link, and halftime and final reports by email.
Every figure we share is a total: Performative never shares names, photos, posts or messages.`;
      await navigator.clipboard.writeText(text); toast("Quote copied");
    };
  };
  const saveAssume = () => {
    clearTimeout(saveAssume.t);
    saveAssume.t = setTimeout(async () => {
      const { error } = await sb.from("pricing_settings").update({ settings: priceAssume, updated_at: new Date().toISOString() }).eq("id", 1);
      if (error) fail(error); else toast("Pricing saved. The sponsor page uses it now.");
    }, 700);
  };

  $("#pqDays").value = pq.days; $("#pqCap").value = pq.cap; $("#pqSlot").value = pq.slot; $("#pqGrowth").value = pq.growth;
  if (pq.region) $("#pqRegion").value = pq.region;
  $("#pqFrom").value = pq.from;
  $("#pqFrom").onchange = e => {
    pq.from = e.target.value; const c = challenges.find(x => x.id === pq.from); if (!c) return draw();
    pq.days = daysBetween(c.starts_on, c.ends_on) + 1; pq.cap = c.capacity || ""; pq.slot = c.featured_on || ""; pq.region = c.region || null;
    $("#pqDays").value = pq.days; $("#pqCap").value = pq.cap; $("#pqSlot").value = pq.slot; if (pq.region) $("#pqRegion").value = pq.region; draw();
  };
  $$("#pqLen button").forEach(b => b.onclick = () => { pq.days = Number(b.dataset.len); $("#pqDays").value = pq.days; draw(); });
  $("#pqDays").oninput = e => { pq.days = e.target.value; draw(); };
  $("#pqCap").oninput = e => { pq.cap = e.target.value; draw(); };
  $("#pqSlot").onchange = e => { pq.slot = e.target.value; draw(); };
  $("#pqGrowth").oninput = e => { pq.growth = e.target.value; draw(); };
  $$("#pqWhere button").forEach(b => b.onclick = () => { pq.region = b.dataset.w === "country" ? ($("#pqRegion").value || "HK") : null; draw(); });
  $("#pqRegion").onchange = e => { pq.region = e.target.value; draw(); };
  $$("#pqBasis button").forEach(b => b.onclick = () => { pq.basis = b.dataset.b; draw(); });
  $$("[data-a]").forEach(i => i.oninput = () => { const v = Number(i.value); if (!isNaN(v)) { priceAssume[i.dataset.a] = v; saveAssume(); draw(); } });
  $("#pqReset").onclick = () => { priceAssume = { ...PRICE_DEFAULTS }; saveAssume(); loadPricing(); };
  draw();
}

// ---------------- People ----------------
async function loadPeople(q = "") {
  const el = $("#tab-people");
  if (!$("#peopleSearch")) {
    el.innerHTML = `<div class="pagehead"><div><h1>People</h1><p>Everyone with an account, newest first.</p></div>
      <div class="search"><input type="search" id="peopleSearch" placeholder="Name, username or email"></div></div><div class="card" style="padding:6px 8px" id="peopleList"></div>`;
    let h; $("#peopleSearch").addEventListener("input", e => { clearTimeout(h); h = setTimeout(() => loadPeople(e.target.value).catch(fail), 250); });
  }
  const { data, error } = await sb.rpc("admin_people", { q }); if (error) throw error;
  $("#peopleList").innerHTML = data.length ? `<table><thead><tr><th>Person</th><th>Email</th><th>Joined</th><th>Posts</th><th>Friends</th><th>Last post</th><th></th></tr></thead><tbody>
    ${data.map(p => `<tr><td><b>${esc(p.name)}</b><div class="muted small">@${esc(p.handle)}</div>
        <div class="row" style="margin-top:4px; gap:6px">${p.suspended_at ? '<span class="pill red">Suspended</span>' : ""}${p.open_reports ? `<span class="pill red">${p.open_reports} report${p.open_reports > 1 ? "s" : ""}</span>` : ""}</div></td>
      <td>${esc(p.email || "")}</td><td>${dayLabel(p.created_at)}</td><td>${fmt(p.posts)}</td><td>${fmt(p.friends)}</td>
      <td>${p.last_post ? when(p.last_post) : '<span class="muted">—</span>'}</td>
      <td style="text-align:right">${p.suspended_at ? `<button class="btn ghost small" data-id="${p.id}" data-s="0">Lift suspension</button>` : `<button class="btn line small" data-id="${p.id}" data-s="1">Suspend</button>`}</td></tr>`).join("")}
    </tbody></table>` : '<div class="empty">No one found.</div>';
  $$("#peopleList button[data-id]").forEach(b => b.onclick = async () => {
    const suspend = b.dataset.s === "1";
    if (!confirm(suspend ? "Suspend this person? They can still open the app but can't post, comment or message." : "Lift the suspension?")) return;
    const { error } = await sb.rpc("admin_set_suspended", { person: b.dataset.id, suspended: suspend });
    if (error) return fail(error); toast(suspend ? "Suspended" : "Suspension lifted"); loadPeople($("#peopleSearch").value).catch(fail);
  });
}

start().catch(fail);
</script>
